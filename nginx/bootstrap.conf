server {
    listen 80;
    listen [::]:80;
    server_name thing.qook.io thingcoding.qook.io thing-admin.qook.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503 "HTTPS certificate setup in progress\n";
        add_header Content-Type text/plain;
    }
}
